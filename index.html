<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mon Chat</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      background: #f2f2f2;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .chat {
      width: 100%;
      max-width: 500px;
      height: 100vh;
      max-height: 800px;
      background: white;
      display: flex;
      flex-direction: column;
    }

    .header {
      background: #6c4cff;
      color: white;
      padding: 18px;
      text-align: center;
      font-size: 22px;
      font-weight: bold;
    }

    .messages {
      flex: 1;
      padding: 20px;
      overflow-y: auto;
    }

    .message {
      background: #eeeeee;
      padding: 12px 15px;
      border-radius: 18px;
      margin-bottom: 10px;
      max-width: 80%;
    }

    .message.me {
      background: #6c4cff;
      color: white;
      margin-left: auto;
    }

    .input-area {
      display: flex;
      padding: 12px;
      border-top: 1px solid #ddd;
      gap: 8px;
    }

    input {
      flex: 1;
      padding: 13px;
      border: 1px solid #ccc;
      border-radius: 25px;
      font-size: 16px;
      outline: none;
    }

    button {
      border: none;
      background: #6c4cff;
      color: white;
      padding: 0 20px;
      border-radius: 25px;
      font-size: 16px;
      font-weight: bold;
    }
  </style>
</head>

<body>

<div class="chat">

  <div class="header">
    💬 Mon Chat
  </div>

  <div class="messages" id="messages">
    <div class="message">👋 Bienvenue dans le chat !</div>
  </div>

  <div class="input-area">
    <input
      type="text"
      id="messageInput"
      placeholder="Écris un message..."
    >

    <button id="sendButton">
      Envoyer
    </button>
  </div>

</div>

<script type="module">

  import { initializeApp }
    from "https://www.gstatic.com/firebasejs/10.12.5/firebase-app.js";

  import {
    getFirestore,
    collection,
    addDoc,
    onSnapshot,
    serverTimestamp
  } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore.js";


  // CONFIGURATION FIREBASE
  // Nous allons mettre ta configuration ici à l'étape suivante.

  const firebaseConfig = {
 // For Firebase JS SDK v7.20.0 and later, measurementId is optional
 apiKey: "AIzaSyBdNJZC3XU2a8X9ztAXAC2wmIAITQdPQEw",
  authDomain: "mon-chat-5c58e.firebaseapp.com",
  databaseURL: "https://mon-chat-5c58e-default-rtdb.firebaseio.com",
  projectId: "mon-chat-5c58e",
  storageBucket: "mon-chat-5c58e.firebasestorage.app",
  messagingSenderId: "677405873801",
  appId: "1:677405873801:web:4a1f829958b7bc5c4ed858",
  measurementId: "G-4Z22LL8GPM"
}; 


  const app = initializeApp(firebaseConfig);

  const db = getFirestore(app);

  const messagesRef = collection(db, "messages");

  const messagesDiv = document.getElementById("messages");
  const input = document.getElementById("messageInput");
  const button = document.getElementById("sendButton");


  button.addEventListener("click", sendMessage);

  input.addEventListener("keydown", function(event) {
    if (event.key === "Enter") {
      sendMessage();
    }
  });


  async function sendMessage()  try { {

    const text = input.value.trim();

    if (text === "") {
      return;
    }

    await addDoc(messagesRef, {
      text: text,
      createdAt: serverTimestamp()
    });

    input.value = "";
  }


  onSnapshot(messagesRef, function(snapshot) {

    messagesDiv.innerHTML = "";

    snapshot.forEach(function(doc) {

      const data = doc.data();

      const message = document.createElement("div");

      message.className = "message me";

      message.textContent = data.text;

      messagesDiv.appendChild(message);

    });

    messagesDiv.scrollTop = messagesDiv.scrollHeight;

  });

</script>

</body>
</html>
