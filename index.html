<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mon Chat</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f2f2f2;
        }

        .chat {
            max-width: 600px;
            height: 100vh;
            margin: auto;
            background: white;
            display: flex;
            flex-direction: column;
        }

        .header {
            background: #075e54;
            color: white;
            padding: 18px;
            font-size: 22px;
            font-weight: bold;
        }

        .messages {
            flex: 1;
            padding: 15px;
            overflow-y: auto;
        }

        .message {
            background: #dcf8c6;
            padding: 10px 14px;
            border-radius: 10px;
            margin-bottom: 10px;
            max-width: 80%;
            margin-left: auto;
        }

        .message.bot {
            background: #eeeeee;
            margin-left: 0;
        }

        .input-area {
            display: flex;
            padding: 10px;
            border-top: 1px solid #ddd;
            gap: 8px;
        }

        input {
            flex: 1;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 20px;
            font-size: 16px;
        }

        button {
            border: none;
            background: #075e54;
            color: white;
            padding: 12px 18px;
            border-radius: 20px;
            font-size: 16px;
        }
    </style>
</head>

<body>

<div class="chat">

    <div class="header">
        💬 Mon Chat
    </div>

    <div class="messages" id="messages">
        <div class="message bot">
            Bonjour 👋 Bienvenue sur mon chat !
        </div>
    </div>

    <div class="input-area">
        <input 
            type="text" 
            id="messageInput" 
            placeholder="Écrire un message..."
        >

        <button onclick="sendMessage()">
            Envoyer
        </button>
    </div>

</div>

<script>
function sendMessage() {

    const input = document.getElementById("messageInput");
    const messages = document.getElementById("messages");

    const text = input.value.trim();

    if (text === "") {
        return;
    }

    const message = document.createElement("div");
    message.className = "message";
    message.textContent = text;

    messages.appendChild(message);

    input.value = "";

    messages.scrollTop = messages.scrollHeight;
}
</script>

</body>
</html>
